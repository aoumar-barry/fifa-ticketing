name: CI/CD

on:
  push:
    branches: [main, develop, preprod]
  pull_request:
    branches: [main, develop, preprod]

jobs:
  # ============================================================
  # Backend — lint + tests + build Docker
  # ============================================================
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Tests (Jest)
        run: npm test -- --coverage --ci
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  # ============================================================
  # Frontend — lint + tests + build Vite
  # ============================================================
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ============================================================
  # Deploy — Trigger Render builds via Deploy Hooks
  # ============================================================
  deploy:
    name: Trigger Render Deploy
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy to Staging (develop)
        if: github.ref == 'refs/heads/develop'
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEVELOP_BACKEND_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEVELOP_FRONTEND_HOOK }}
        run: |
          echo "Triggering develop deployment on Render..."
          if [ -n "$BACKEND_HOOK" ]; then
            curl -f -X POST "$BACKEND_HOOK"
          else
            echo "RENDER_DEVELOP_BACKEND_HOOK is not set."
          fi
          if [ -n "$FRONTEND_HOOK" ]; then
            curl -f -X POST "$FRONTEND_HOOK"
          else
            echo "RENDER_DEVELOP_FRONTEND_HOOK is not set."
          fi

      - name: Deploy to Preproduction (preprod)
        if: github.ref == 'refs/heads/preprod'
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_PREPROD_BACKEND_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_PREPROD_FRONTEND_HOOK }}
        run: |
          echo "Triggering preprod deployment on Render..."
          if [ -n "$BACKEND_HOOK" ]; then
            curl -f -X POST "$BACKEND_HOOK"
          else
            echo "RENDER_PREPROD_BACKEND_HOOK is not set."
          fi
          if [ -n "$FRONTEND_HOOK" ]; then
            curl -f -X POST "$FRONTEND_HOOK"
          else
            echo "RENDER_PREPROD_FRONTEND_HOOK is not set."
          fi

      - name: Deploy to Production (main)
        if: github.ref == 'refs/heads/main'
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_PRODUCTION_BACKEND_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_PRODUCTION_FRONTEND_HOOK }}
        run: |
          echo "Triggering production deployment on Render..."
          if [ -n "$BACKEND_HOOK" ]; then
            curl -f -X POST "$BACKEND_HOOK"
          else
            echo "RENDER_PRODUCTION_BACKEND_HOOK is not set."
          fi
          if [ -n "$FRONTEND_HOOK" ]; then
            curl -f -X POST "$FRONTEND_HOOK"
          else
            echo "RENDER_PRODUCTION_FRONTEND_HOOK is not set."
          fi


